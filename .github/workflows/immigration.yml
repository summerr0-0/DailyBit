name: Canada PR draws

# 캐나다 영주권 선발 모니터 (spec: specs/immigration-monitor/spec.md).
# 하루 1번 01:00 UTC (밴쿠버 17:00 PST 무렵 — 그날 발표된 선발이 올라온 뒤). AI 없음, 결과는 비공개.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: immigration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Monitor
        run: pnpm tsx scripts/immigration.ts
        env:
          # Supabase Session Pooler (IPv4) — GitHub 러너는 IPv6가 없다
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
