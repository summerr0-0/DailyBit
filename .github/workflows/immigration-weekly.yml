name: Canada PR weekly

# 이민 기사 주간 요약 (spec: specs/immigration-community/spec.md). CN드림 이민 뉴스 → 한국어 요약 → 비공개 Bit.
# 월요일 01:00 UTC. 원문은 저장하지 않고, 개인 정보는 AI에 보내지 않는다.
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

concurrency:
  group: immigration-weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # AI는 Claude Code CLI로 호출 — curate와 같은 구독 토큰
      - run: npm install -g @anthropic-ai/claude-code@2.1.328
      # 구독 토큰 인증 확인 — 실패하면 원인(인증·모델 접근)이 여기서 그대로 보이고 요약은 돌지 않는다.
      # 시크릿 앞뒤 공백 제거 — 붙여넣기 때 들어간 공백으로 인증이 실패한 적이 있다. 이후 단계는 정리된 값을 쓴다.
      - name: Normalize Claude token
        run: |
          token=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$token"
          echo "CLAUDE_CODE_OAUTH_TOKEN=$token" >> "$GITHUB_ENV"
        env:
          RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Check Claude CLI auth
        run: |
          out=$(claude -p "Reply with the single word OK." --model claude-haiku-5-5 --output-format json --tools "" --strict-mcp-config --no-session-persistence 2>&1) || true
          # CLI의 에러 문구(result)만 보여준다 — 예: "Failed to authenticate. API Error: 401 ..."
          echo "$out" | tail -n 1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(`is_error=${j.is_error} result=${String(j.result).slice(0,300)}`)}catch{console.log(s.slice(0,300))}})'
          echo "$out" | grep -q '"is_error":false' || { echo "::error::Claude CLI auth/model check failed"; exit 1; }
      - name: Weekly digest
        run: pnpm tsx scripts/immigration-weekly.ts
        env:
          # Supabase Session Pooler (IPv4) — GitHub 러너는 IPv6가 없다
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWS_AI_BACKEND: cli
