name: News curation

# 해외 AI·보안 RSS를 수집해 /scrap News inbox에 비공개 초안을 만든다 (spec: specs/news-curation/spec.md).
# 06:00·18:00 KST = 21:00·09:00 UTC. 초안은 오너가 확인한 뒤에만 발행된다.
on:
  schedule:
    - cron: "0 21,9 * * *"
  workflow_dispatch:

concurrency:
  group: curate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  curate:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # AI는 Claude Code CLI로 호출 — API 키 대신 Claude 구독 토큰(`claude setup-token`) 사용
      - run: npm install -g @anthropic-ai/claude-code@2.1.328
      # 구독 토큰 인증 확인 — 실패하면 원인(인증·모델 접근)이 여기서 그대로 보이고 curate는 돌지 않는다.
      - name: Check Claude CLI auth
        run: |
          out=$(claude -p "Reply with the single word OK." --model claude-haiku-5-5 --output-format json --tools "" --strict-mcp-config --no-session-persistence 2>&1) || true
          echo "$out" | head -c 600; echo
          echo "$out" | grep -q '"is_error":false' || { echo "::error::Claude CLI auth/model check failed"; exit 1; }
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Curate
        run: pnpm tsx scripts/curate.ts
        env:
          # Supabase Session Pooler (IPv4) — GitHub 러너는 IPv6가 없다
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWS_AI_BACKEND: cli
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
